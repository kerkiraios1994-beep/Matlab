<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MathLab</title><style>:root{font:16px system-ui;color:#61465a;background:#fffbfd}*{box-sizing:border-box}body{margin:0}header{background:#faedf3;padding:17px 20px;font-size:25px;font-weight:700;text-align:center}main{max-width:900px;margin:auto;padding:18px}.card{background:white;border:1px solid #f1dfe8;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 4px 20px #63314c0a}h1{font-size:25px}button{border:0;border-radius:11px;background:#a36a89;color:white;padding:12px 16px;font-weight:600;cursor:pointer;margin:3px}button.alt{color:#8c5270;background:#f8e9f0}select{width:100%;padding:12px;border:1px solid #e5cbd9;border-radius:10px;margin:6px 0 15px;font:inherit;background:white}input{width:100%;padding:12px;border:1px solid #e5cbd9;border-radius:10px;margin:6px 0 15px;font:inherit}label{font-size:14px}nav{display:flex;flex-wrap:wrap;gap:6px}.hide{display:none}.muted{color:#907b88}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.tile{padding:16px;background:#fff5f9;border-radius:14px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:9px;text-align:left;border-bottom:1px solid #f0e0e8}.scroll{overflow-x:auto}</style></head><body><header>MathLab</header><main><div id="auth" class="card"><h1>Καλώς ήρθες στο MathLab</h1><p class="muted">Δοκιμαστικό περιβάλλον φροντιστηρίου μαθηματικών</p><form id="loginForm"><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Κωδικός</label><input id="password" type="password" required autocomplete="current-password"><button>Σύνδεση</button></form><button class="alt" id="forgot">Ξέχασα τον κωδικό μου</button><p id="message" role="status"></p></div><div id="recovery" class="card hide"><h1>Νέος κωδικός</h1><form id="passwordForm"><label>Ορισμός κωδικού (τουλάχιστον 12 χαρακτήρες)</label><input id="newPassword" type="password" minlength="12" required autocomplete="new-password"><button>Αποθήκευση</button></form><p id="recoveryMessage"></p></div><section id="dashboard" class="hide"><div class="card"><h1>Πίνακας διαχείρισης</h1><p id="profile"></p><button class="alt" id="logout">Έξοδος</button></div><nav id="nav"></nav><div id="view"></div></section></main><script type="module">import{createClient}from "https://esm.sh/@supabase/supabase-js@2.76.1";const supabase=createClient("https://terlbwqcmrfsjhagtxch.supabase.co","sb_publishable_-v9E4RXTp2VBKsCiGjcQ3A_d3kJmdJ0");const $=x=>document.getElementById(x),escapeHtml=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let profile=null;function screen(id){for(let a of ["auth","dashboard","recovery"])$(a).classList.toggle("hide",a!==id)}const tabs={students:["Μαθητές",["full_name","grade"]],classes:["Τμήματα",["name","weekday","starts_at","ends_at"]],attendance:["Απουσίες",["session_date","status"]],assignments:["Εργασίες",["title","due_date"]],grades:["Βαθμολογίες",["title","score","max_score"]],invoices:["Δίδακτρα",["period","amount","paid_amount"]],announcements:["Ανακοινώσεις",["title","body"]]};let studentRecords=[];const levels={primary:"Δημοτικό",middle:"Γυμνάσιο",high:"Λύκειο"};function studentList(q=""){const rows=studentRecords.filter(s=>[s.full_name,s.grade,levels[s.level]].join(" ").toLocaleLowerCase("el").includes(q.toLocaleLowerCase("el")));$("studentRows").innerHTML=rows.map(s=>'<tr><td>'+escapeHtml(s.full_name)+'</td><td>'+escapeHtml(levels[s.level])+'</td><td>'+escapeHtml(s.grade)+'</td><td><button class="alt" data-edit-student="'+escapeHtml(s.id)+'">Επεξεργασία</button></td></tr>').join("")||'<tr><td colspan="4">Δεν βρέθηκαν μαθητές.</td></tr>'}function studentForm(s){const id=s?.id||"";return '<div class="card" id="studentEditor"><h2>'+(id?'Επεξεργασία μαθητή':'Νέος μαθητής')+'</h2><form id="studentForm"><input type="hidden" name="id" value="'+escapeHtml(id)+'"><label>Ονοματεπώνυμο</label><input name="full_name" required maxlength="150" value="'+escapeHtml(s?.full_name||"")+'"><label>Βαθμίδα</label><select name="level" required>'+Object.entries(levels).map(([v,t])=>'<option value="'+v+'" '+(s?.level===v?'selected':'')+'>'+t+'</option>').join("")+'</select><label>Τάξη</label><input name="grade" maxlength="60" required value="'+escapeHtml(s?.grade||"")+'" placeholder="π.χ. Β΄ Γυμνασίου"><label><input type="checkbox" name="active" style="width:auto" '+(s?.active!==false?'checked':'')+'> Ενεργός μαθητής</label><p><button type="submit">Αποθήκευση</button> <button type="button" class="alt" id="cancelStudent">Ακύρωση</button></p><p id="studentStatus" role="status"></p></form></div>'}async function studentsView(){ $("view").innerHTML='<div class="card">Φόρτωση μαθητών...</div>';const{data,error}=await supabase.from("students").select("id,full_name,level,grade,active").order("full_name");if(error){$("view").innerHTML='<div class="card">'+escapeHtml(error.message)+'</div>';return}studentRecords=data||[];$("view").innerHTML='<div class="card"><h2>Μαθητές ('+studentRecords.length+')</h2>'+(profile?.role==="admin"?'<button id="addStudent">+ Προσθήκη μαθητή</button>':'')+'<label for="studentSearch">Αναζήτηση μαθητή</label><input id="studentSearch" placeholder="Όνομα ή τάξη"><div class="scroll"><table><thead><tr><th>Ονοματεπώνυμο</th><th>Βαθμίδα</th><th>Τάξη</th><th></th></tr></thead><tbody id="studentRows"></tbody></table></div></div><div id="studentFormSlot"></div>';studentList()}$("view").addEventListener("input",e=>{if(e.target.id==="studentSearch")studentList(e.target.value)});$("view").addEventListener("click",e=>{if(e.target.id==="addStudent")$("studentFormSlot").innerHTML=studentForm(null);if(e.target.id==="cancelStudent")$("studentFormSlot").innerHTML="";if(e.target.dataset.editStudent&&profile?.role==="admin"){let s=studentRecords.find(x=>x.id===e.target.dataset.editStudent);if(s){$("studentFormSlot").innerHTML=studentForm(s);$("studentEditor").scrollIntoView({behavior:"smooth"})}}});$("view").addEventListener("submit",async e=>{if(e.target.id!=="studentForm")return;e.preventDefault();if(profile?.role!=="admin")return;const form=e.target,fd=new FormData(form),id=fd.get("id"),student={full_name:String(fd.get("full_name")).trim(),level:fd.get("level"),grade:String(fd.get("grade")).trim(),active:fd.has("active")};if(!student.full_name||!student.grade)return;$("studentStatus").textContent="Αποθήκευση...";const response=id?await supabase.from("students").update(student).eq("id",id).select("id"):await supabase.from("students").insert(student).select("id");if(response.error){$("studentStatus").textContent="Σφάλμα: "+response.error.message;return}if(!response.data?.length){$("studentStatus").textContent="Η αλλαγή δεν αποθηκεύτηκε. Έλεγξε τα δικαιώματα.";return}await studentsView()});async function view(table){if(table==="students")return studentsView();$("view").innerHTML='<div class="card">Φόρτωση...</div>';let {data,error}=await supabase.from(table).select("*").limit(100);if(error){$("view").innerHTML='<div class="card">'+escapeHtml(error.message)+'</div>';return}const fields=tabs[table][1];$("view").innerHTML='<div class="card"><h2>'+tabs[table][0]+'</h2><div class="scroll"><table><thead><tr>'+fields.map(f=>'<th>'+escapeHtml(f)+'</th>').join("")+'</tr></thead><tbody>'+data.map(r=>'<tr>'+fields.map(f=>'<td>'+escapeHtml(r[f])+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>'+(data.length?'':'<p class="muted">Δεν υπάρχουν καταχωρίσεις.</p>')+'</div>'}async function start(){const{data:{user}}=await supabase.auth.getUser();if(!user){screen("auth");return}const{data,error}=await supabase.from("profiles").select("full_name,role,active").eq("id",user.id).single();if(error||!data?.active){screen("auth");$("message").textContent="Ο λογαριασμός δεν έχει ενεργό ρόλο.";return}profile=data;screen("dashboard");$("profile").textContent=profile.full_name+" · "+({admin:"Διεύθυνση",teacher:"Καθηγητής",student:"Μαθητής",parent:"Γονέας"}[profile.role]);$("nav").innerHTML=Object.entries(tabs).map(([id,item])=>'<button class="alt" data-tab="'+id+'">'+item[0]+'</button>').join("");view("students")};$("nav").onclick=e=>{const id=e.target.dataset.tab;if(id)view(id)};$("loginForm").onsubmit=async e=>{e.preventDefault();$("message").textContent="Σύνδεση...";const{error}=await supabase.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error)$("message").textContent=error.message;else start()};$("forgot").onclick=async()=>{if(!$("email").value){$("message").textContent="Συμπλήρωσε το email σου.";return}const{error}=await supabase.auth.resetPasswordForEmail($("email").value,{redirectTo:location.origin+location.pathname});$("message").textContent=error?error.message:"Αν υπάρχει λογαριασμός, θα λάβεις email επαναφοράς."};$("passwordForm").onsubmit=async e=>{e.preventDefault();const{error}=await supabase.auth.updateUser({password:$("newPassword").value});$("recoveryMessage").textContent=error?error.message:"Ο κωδικός αποθηκεύτηκε.";if(!error)start()};$("logout").onclick=async()=>{await supabase.auth.signOut();screen("auth")};supabase.auth.onAuthStateChange((event)=>{if(event==="PASSWORD_RECOVERY")screen("recovery")});start();</script></body></html>
