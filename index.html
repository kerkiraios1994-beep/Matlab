<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MathLab</title><style>:root{font:16px system-ui;color:#61465a;background:#fffbfd}*{box-sizing:border-box}body{margin:0}header{background:#faedf3;padding:17px 20px;font-size:25px;font-weight:700;text-align:center}main{max-width:900px;margin:auto;padding:18px}.card{background:white;border:1px solid #f1dfe8;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 4px 20px #63314c0a}h1{font-size:25px}button{border:0;border-radius:11px;background:#a36a89;color:white;padding:12px 16px;font-weight:600;cursor:pointer;margin:3px}button.alt{color:#8c5270;background:#f8e9f0}select{width:100%;padding:12px;border:1px solid #e5cbd9;border-radius:10px;margin:6px 0 15px;font:inherit;background:white}input{width:100%;padding:12px;border:1px solid #e5cbd9;border-radius:10px;margin:6px 0 15px;font:inherit}label{font-size:14px}nav{display:flex;flex-wrap:wrap;gap:6px}.hide{display:none}.muted{color:#907b88}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.tile{padding:16px;background:#fff5f9;border-radius:14px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:9px;text-align:left;border-bottom:1px solid #f0e0e8}.scroll{overflow-x:auto}.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:12px 0}.monthgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;font-size:12px;font-weight:700;color:#876a7c;padding:6px 0}.daycell{min-width:0;min-height:75px;border:1px solid #f0dfe8;background:white;color:#61465a;border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:3px;text-align:left;overflow-wrap:anywhere}.daycell.current{border:2px solid #a36a89;background:#fff5f9}.daycell.empty{border:0;background:none}.dateNum{font-weight:750;font-size:14px}.eventchip{display:block;font-size:11px;white-space:normal;background:#f8e5f0;color:#70465c;padding:3px;border-radius:5px;line-height:1.25}.dayform{margin-top:14px;border:1px solid #f1dfe8;padding:15px;border-radius:12px;background:#fff9fc}@media(max-width:550px){main{padding:9px}.card{padding:13px}.monthgrid{gap:3px}.daycell{min-height:65px;padding:3px}.eventchip{font-size:10px}.weekday{font-size:11px}button{padding:10px}}</style></head><body><header>MathLab</header><main><div id="auth" class="card"><h1>Καλώς ήρθες στο MathLab</h1><p class="muted">Δοκιμαστικό περιβάλλον φροντιστηρίου μαθηματικών</p><form id="loginForm"><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Κωδικός</label><input id="password" type="password" required autocomplete="current-password"><button>Σύνδεση</button></form><button class="alt" id="forgot">Ξέχασα τον κωδικό μου</button><p id="message" role="status"></p></div><div id="recovery" class="card hide"><h1>Νέος κωδικός</h1><form id="passwordForm"><label>Ορισμός κωδικού (τουλάχιστον 12 χαρακτήρες)</label><input id="newPassword" type="password" minlength="12" required autocomplete="new-password"><button>Αποθήκευση</button></form><p id="recoveryMessage"></p></div><section id="dashboard" class="hide"><div class="card"><h1>Πίνακας διαχείρισης</h1><p id="profile"></p><button class="alt" id="logout">Έξοδος</button></div><nav id="nav"></nav><div id="view"></div></section></main><script type="module">import{createClient}from "https://esm.sh/@supabase/supabase-js@2.76.1";const supabase=createClient("https://terlbwqcmrfsjhagtxch.supabase.co","sb_publishable_-v9E4RXTp2VBKsCiGjcQ3A_d3kJmdJ0");const $=x=>document.getElementById(x),escapeHtml=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let profile=null;function screen(id){for(let a of ["auth","dashboard","recovery"])$(a).classList.toggle("hide",a!==id)}const tabs={calendar:["Ημερολόγιο",[]],students:["Μαθητές",["full_name","grade"]],classes:["Τμήματα",["name","weekday","starts_at","ends_at"]],attendance:["Απουσίες",["session_date","status"]],assignments:["Εργασίες",["title","due_date"]],grades:["Βαθμολογίες",["title","score","max_score"]],invoices:["Δίδακτρα",["period","amount","paid_amount"]],announcements:["Ανακοινώσεις",["title","body"]]};let studentToken="";async function studentApi(method,params="",payload){if(!studentToken)throw new Error("Η σύνδεση χρειάζεται ανανέωση. Κάνε είσοδο ξανά.");const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),10000);try{const res=await fetch("https://terlbwqcmrfsjhagtxch.supabase.co/rest/v1/students"+params,{method,headers:{"apikey":"sb_publishable_-v9E4RXTp2VBKsCiGjcQ3A_d3kJmdJ0","Authorization":"Bearer "+studentToken,"Content-Type":"application/json","Prefer":method==="POST"?"resolution=merge-duplicates,return=representation":"return=representation"},body:payload?JSON.stringify(payload):undefined,signal:ctl.signal});let body=await res.json().catch(()=>null);if(!res.ok)throw new Error((body?.message||body?.details||body?.hint||"HTTP "+res.status)+" (HTTP "+res.status+")");return body||[]}catch(e){if(e.name==="AbortError")throw new Error("Η επικοινωνία με τη βάση ξεπέρασε τα 10 δευτερόλεπτα.");throw e}finally{clearTimeout(timer)}}let studentRecords=[];const levels={primary:"Δημοτικό",middle:"Γυμνάσιο",high:"Λύκειο"};function studentList(q=""){const rows=studentRecords.filter(s=>[s.full_name,s.grade,levels[s.level],s.phone||""].join(" ").toLocaleLowerCase("el").includes(q.toLocaleLowerCase("el")));$("studentRows").innerHTML=rows.map(s=>'<tr><td>'+escapeHtml(s.full_name)+'</td><td>'+escapeHtml(levels[s.level])+'</td><td>'+escapeHtml(s.grade)+'</td><td>'+escapeHtml(s.phone||"—")+'</td><td>'+(s.monthly_tuition==null?"—":Number(s.monthly_tuition).toLocaleString("el-GR",{style:"currency",currency:"EUR"}))+'</td><td><button class="alt" data-edit-student="'+escapeHtml(s.id)+'">Επεξεργασία</button></td></tr>').join("")||'<tr><td colspan="6">Δεν βρέθηκαν μαθητές.</td></tr>'}function studentForm(s){const id=s?.id||"";return '<div class="card" id="studentEditor"><h2>'+(id?'Επεξεργασία μαθητή':'Νέος μαθητής')+'</h2><form id="studentForm"><input type="hidden" name="id" value="'+escapeHtml(id)+'"><label>Ονοματεπώνυμο</label><input name="full_name" required maxlength="150" value="'+escapeHtml(s?.full_name||"")+'"><label>Βαθμίδα</label><select name="level" required>'+Object.entries(levels).map(([v,t])=>'<option value="'+v+'" '+(s?.level===v?'selected':'')+'>'+t+'</option>').join("")+'</select><label>Τάξη</label><input name="grade" maxlength="60" required value="'+escapeHtml(s?.grade||"")+'" placeholder="π.χ. Β΄ Γυμνασίου"><label>Κινητό</label><input name="phone" type="tel" maxlength="30" value="'+escapeHtml(s?.phone||"")+'"><label>Μηνιαία δίδακτρα (€)</label><input name="monthly_tuition" type="number" min="0" step="0.01" inputmode="decimal" placeholder="π.χ. 80" value="'+escapeHtml(s?.monthly_tuition??"")+'"><label><input type="checkbox" name="active" style="width:auto" '+(s?.active!==false?'checked':'')+'> Ενεργός μαθητής</label><p><button type="submit">Αποθήκευση</button> <button type="button" class="alt" id="cancelStudent">Ακύρωση</button></p><p id="studentStatus" role="status"></p></form></div>'}async function studentsView(){ $("view").innerHTML='<div class="card">Φόρτωση μαθητών...</div>';let data;try{data=await studentApi("GET","?select=id,full_name,level,grade,active,phone,monthly_tuition&order=full_name.asc")}catch(error){$("view").innerHTML='<div class="card">Δεν φορτώθηκαν οι μαθητές: '+escapeHtml(error.message)+'</div>';return}studentRecords=data||[];$("view").innerHTML='<div class="card"><h2>Μαθητές ('+studentRecords.length+')</h2>'+(profile?.role==="admin"?'<button id="addStudent">+ Προσθήκη μαθητή</button>':'')+'<label for="studentSearch">Αναζήτηση μαθητή</label><input id="studentSearch" placeholder="Όνομα ή τάξη"><div class="scroll"><table><thead><tr><th>Ονοματεπώνυμο</th><th>Βαθμίδα</th><th>Τάξη</th><th>Κινητό</th><th>Δίδακτρα/μήνα</th><th></th></tr></thead><tbody id="studentRows"></tbody></table></div></div><div id="studentFormSlot"></div>';studentList()}$("view").addEventListener("input",e=>{if(e.target.id==="studentSearch")studentList(e.target.value)});$("view").addEventListener("click",e=>{if(e.target.id==="addStudent")$("studentFormSlot").innerHTML=studentForm(null);if(e.target.id==="cancelStudent")$("studentFormSlot").innerHTML="";if(e.target.dataset.editStudent&&profile?.role==="admin"){let s=studentRecords.find(x=>x.id===e.target.dataset.editStudent);if(s){$("studentFormSlot").innerHTML=studentForm(s);$("studentEditor").scrollIntoView({behavior:"smooth"})}}});$("view").addEventListener("submit",async e=>{if(e.target.id!=="studentForm")return;e.preventDefault();if(profile?.role!=="admin")return;const form=e.target,fd=new FormData(form),id=fd.get("id"),student={full_name:String(fd.get("full_name")).trim(),level:fd.get("level"),grade:String(fd.get("grade")).trim(),phone:String(fd.get("phone")||"").trim()||null,monthly_tuition:String(fd.get("monthly_tuition")||"").trim()===""?null:Number(fd.get("monthly_tuition")),active:fd.has("active")};if(!student.full_name||!student.grade)return;$("studentStatus").textContent="Αποθήκευση...";const saveButton=form.querySelector('button[type="submit"]');if(saveButton)saveButton.disabled=true;try{const rowId=id||form.dataset.pendingStudentId||crypto.randomUUID();if(!id)form.dataset.pendingStudentId=rowId;const payload={...student,...(!id?{id:rowId}:{})};const records=await studentApi(id?"PATCH":"POST",id?"?id=eq."+encodeURIComponent(id):"?on_conflict=id",payload);if(!records?.length)throw new Error("Η βάση δεν επιβεβαίωσε την καταχώριση.");$("studentStatus").textContent="Επαλήθευση αποθήκευσης...";const verified=await studentApi("GET","?id=eq."+encodeURIComponent(rowId)+"&select=id,full_name,level,grade,active,phone,monthly_tuition");if(!verified?.length)throw new Error("Δεν βρέθηκε η νέα εγγραφή κατά την επαλήθευση.");studentRecords=[...studentRecords.filter(r=>r.id!==rowId),verified[0]];$("studentStatus").textContent="Ο μαθητής αποθηκεύτηκε επιτυχώς.";await studentsView()}catch(err){$("studentStatus").textContent="Η αποθήκευση χρειάζεται έλεγχο: "+(err?.message||"Άγνωστο σφάλμα.")+" Μην πατήσεις ξανά Αποθήκευση· έλεγξε πρώτα τη λίστα μαθητών."}finally{if(saveButton&&saveButton.isConnected)saveButton.disabled=false}});
let calendarDate=new Date(),selectedLessonDate="",calendarLessons=[];
const dateKey=(y,m,d)=>y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
async function calendarView(){
 if(profile?.role!=="admin")return;
 $("view").innerHTML='<div class="card"><h2>Ημερολόγιο μαθημάτων</h2><p id="calendarStatus" role="status" class="muted">Φόρτωση...</p><div class="monthbar"><button class="alt" id="prevMonth">‹ Προηγούμενος</button><strong id="monthName"></strong><button class="alt" id="nextMonth">Επόμενος ›</button></div><div class="monthgrid" id="monthGrid"></div><div id="lessonEditor" class="dayform hide"><h3 id="lessonEditorTitle"></h3><form id="lessonEditorForm"><label>Ώρα<input name="time" type="time" required></label><label>Μαθητής<select name="student" required id="lessonStudent"></select></label><label>Μάθημα<input name="subject" maxlength="100" required placeholder="π.χ. Άλγεβρα"></label><p><button type="submit">Αποθήκευση μαθήματος</button><button type="button" class="alt" id="cancelLesson">Ακύρωση</button></p></form></div><h3 id="selectedDayLabel"></h3><ul id="selectedDayList"></ul></div>';
 $("prevMonth").onclick=()=>{calendarDate=new Date(calendarDate.getFullYear(),calendarDate.getMonth()-1,1);drawCalendar()};
 $("nextMonth").onclick=()=>{calendarDate=new Date(calendarDate.getFullYear(),calendarDate.getMonth()+1,1);drawCalendar()};
 $("cancelLesson").onclick=()=>$("lessonEditor").classList.add("hide");
 $("lessonEditorForm").onsubmit=async e=>{
  e.preventDefault();
  const form=e.currentTarget,fd=new FormData(form),btn=form.querySelector('button[type="submit"]');
  btn.disabled=true;
  try{
   const {data,error}=await supabase.from("lessons").insert({student_id:String(fd.get("student")),lesson_date:selectedLessonDate,lesson_time:String(fd.get("time")),subject:String(fd.get("subject")).trim()}).select("id").single();
   if(error)throw error;
   if(!data?.id)throw Error("Η βάση δεν επιβεβαίωσε την εγγραφή.");
   const r=await supabase.from("lessons").select("id,student_id,lesson_date,lesson_time,subject").order("lesson_date");
   if(r.error)throw r.error;
   calendarLessons=r.data||[];form.reset();$("lessonEditor").classList.add("hide");
   drawCalendar();$("calendarStatus").textContent="Το μάθημα αποθηκεύτηκε.";
  }catch(err){$("calendarStatus").textContent="Η αποθήκευση χρειάζεται έλεγχο: "+err.message}finally{btn.disabled=false}
 };
 try{
  const [st,ls]=await Promise.all([studentApi("GET","?select=id,full_name,level,grade,active,phone,monthly_tuition&order=full_name.asc"),supabase.from("lessons").select("id,student_id,lesson_date,lesson_time,subject").order("lesson_date")]);
  if(ls.error)throw ls.error;
  studentRecords=st||[];calendarLessons=ls.data||[];
  $("calendarStatus").textContent="Πάτησε μία ημέρα για να προσθέσεις μάθημα.";drawCalendar();
 }catch(err){$("calendarStatus").textContent="Δεν φορτώθηκε το ημερολόγιο: "+err.message}
}
function drawCalendar(){
 const grid=$("monthGrid");if(!grid)return;grid.replaceChildren();
 const y=calendarDate.getFullYear(),m=calendarDate.getMonth();
 $("monthName").textContent=new Intl.DateTimeFormat("el-GR",{month:"long",year:"numeric"}).format(calendarDate);
 for(const label of ["Δε","Τρ","Τε","Πε","Πα","Σα","Κυ"]){const el=document.createElement("div");el.className="weekday";el.textContent=label;grid.append(el)}
 for(let j=0;j<(new Date(y,m,1).getDay()+6)%7;j++){const el=document.createElement("div");el.className="daycell empty";grid.append(el)}
 for(let d=1;d<=new Date(y,m+1,0).getDate();d++){
  const date=dateKey(y,m,d),btn=document.createElement("button");btn.type="button";btn.className="daycell"+(selectedLessonDate===date?" current":"");
  const num=document.createElement("span");num.className="dateNum";num.textContent=d;btn.append(num);
  for(const lesson of calendarLessons.filter(x=>x.lesson_date===date).slice(0,3)){
   const chip=document.createElement("span");chip.className="eventchip";chip.textContent=String(lesson.lesson_time).slice(0,5)+" "+(studentRecords.find(x=>x.id===lesson.student_id)?.full_name||"")+" · "+lesson.subject;btn.append(chip)
  }
  btn.onclick=()=>{
   selectedLessonDate=date;$("lessonEditorTitle").textContent="Μάθημα για "+date;
   const pick=$("lessonStudent");pick.replaceChildren(new Option("Επιλογή μαθητή",""));
   for(const st of studentRecords.filter(x=>x.active!==false))pick.append(new Option(st.full_name,st.id));
   $("lessonEditor").classList.remove("hide");drawCalendar();$("lessonEditor").scrollIntoView({block:"nearest",behavior:"smooth"});
  };grid.append(btn)
 }
 $("selectedDayLabel").textContent=selectedLessonDate?"Μαθήματα "+selectedLessonDate:"";
 const list=$("selectedDayList");list.replaceChildren();
 for(const lesson of calendarLessons.filter(x=>x.lesson_date===selectedLessonDate).sort((a,b)=>String(a.lesson_time).localeCompare(String(b.lesson_time)))){
  const li=document.createElement("li");li.textContent=String(lesson.lesson_time).slice(0,5)+" — "+(studentRecords.find(x=>x.id===lesson.student_id)?.full_name||"Άγνωστος μαθητής")+" — "+lesson.subject;list.append(li)
 }
}
async function view(table){if(table==="students")return studentsView();if(table==="calendar")return calendarView();$("view").innerHTML='<div class="card">Φόρτωση...</div>';let {data,error}=await supabase.from(table).select("*").limit(100);if(error){$("view").innerHTML='<div class="card">'+escapeHtml(error.message)+'</div>';return}const fields=tabs[table][1];$("view").innerHTML='<div class="card"><h2>'+tabs[table][0]+'</h2><div class="scroll"><table><thead><tr>'+fields.map(f=>'<th>'+escapeHtml(f)+'</th>').join("")+'</tr></thead><tbody>'+data.map(r=>'<tr>'+fields.map(f=>'<td>'+escapeHtml(r[f])+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>'+(data.length?'':'<p class="muted">Δεν υπάρχουν καταχωρίσεις.</p>')+'</div>'}async function start(signedInUser){try{let user=signedInUser;if(!user){const session=await Promise.race([supabase.auth.getSession(),new Promise((_,reject)=>setTimeout(()=>reject(new Error("Ο έλεγχος σύνδεσης καθυστέρησε.")),12000))]);user=session.data?.session?.user;studentToken=session.data?.session?.access_token||studentToken;}if(!user){screen("auth");$("message").textContent="Δεν υπάρχει ενεργή σύνδεση. Δοκίμασε ξανά.";return}const result=await Promise.race([supabase.from("profiles").select("full_name,role,active").eq("id",user.id).maybeSingle(),new Promise((_,reject)=>setTimeout(()=>reject(new Error("Η φόρτωση του λογαριασμού καθυστέρησε.")),12000))]);if(result.error)throw result.error;if(!result.data?.active){screen("auth");$("message").textContent="Ο λογαριασμός δεν έχει ενεργό ρόλο. Επικοινώνησε με τη διαχείριση.";return}profile=result.data;screen("dashboard");$("profile").textContent=profile.full_name+" · "+({admin:"Διεύθυνση",teacher:"Καθηγητής",student:"Μαθητής",parent:"Γονέας"}[profile.role]);$("nav").innerHTML=(profile.role==="admin"?Object.entries(tabs):[]).map(([id,item])=>'<button class="alt" data-tab="'+id+'">'+item[0]+'</button>').join("");if(profile.role==="admin")view("students");else $("view").innerHTML='<div class="card"><h2>Προσωπική περιοχή μαθητή</h2><p>Το περιβάλλον μαθητή είναι υπό ανάπτυξη.</p></div>'}catch(err){screen("auth");$("message").textContent="Πρόβλημα φόρτωσης: "+(err?.message||"Δοκίμασε ξανά.")}};$("nav").onclick=e=>{const id=e.target.dataset.tab;if(id&&profile?.role==="admin")view(id)};$("loginForm").onsubmit=async e=>{e.preventDefault();const submit=e.target.querySelector('button[type="submit"],button:not([type])');if(submit)submit.disabled=true;$("message").textContent="Σύνδεση...";try{const result=await Promise.race([supabase.auth.signInWithPassword({email:$("email").value,password:$("password").value}),new Promise((_,reject)=>setTimeout(()=>reject(new Error("Η σύνδεση καθυστέρησε. Έλεγξε τη σύνδεση στο διαδίκτυο.")),15000))]);if(result.error)throw result.error;$("message").textContent="Επιτυχής έλεγχος κωδικού. Φόρτωση...";studentToken=result.data.session?.access_token||studentToken;await start(result.data.user)}catch(err){$("message").textContent="Σφάλμα σύνδεσης: "+(err?.message||"Δοκίμασε ξανά.")}finally{if(submit)submit.disabled=false}};$("forgot").onclick=async()=>{if(!$("email").value){$("message").textContent="Συμπλήρωσε το email σου.";return}const{error}=await supabase.auth.resetPasswordForEmail($("email").value,{redirectTo:location.origin+location.pathname});$("message").textContent=error?error.message:"Αν υπάρχει λογαριασμός, θα λάβεις email επαναφοράς."};$("passwordForm").onsubmit=async e=>{e.preventDefault();const{error}=await supabase.auth.updateUser({password:$("newPassword").value});$("recoveryMessage").textContent=error?error.message:"Ο κωδικός αποθηκεύτηκε.";if(!error)start()};$("logout").onclick=async()=>{await supabase.auth.signOut();screen("auth")};supabase.auth.onAuthStateChange((event,session)=>{if(session?.access_token)studentToken=session.access_token;if(event==="PASSWORD_RECOVERY")screen("recovery")});start();</script></body></html>
