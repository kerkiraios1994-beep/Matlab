<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MathLab 2 — Δοκιμή</title><style>:root{font-family:system-ui,sans-serif;background:#f2f5fa;color:#172a5a}body{margin:0}header{background:#172a5a;color:#fff;padding:18px}main{max-width:720px;margin:auto;padding:16px}.card{background:white;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0001}button{border:0;border-radius:8px;background:#172a5a;color:white;padding:12px 15px;margin:3px;font-weight:650}button.alt{background:#dfe6f2;color:#172a5a}label{display:block;margin-top:10px}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #b5c0d3;border-radius:7px;margin-top:4px;font:inherit}li{padding:9px 0;border-bottom:1px solid #eee}.hidden{display:none}.notice{background:#fff3d3;color:#653d00;padding:13px;border-radius:10px}small{color:#52637d}.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px}.monthgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.weekday{text-align:center;font-size:12px;font-weight:700;padding:10px 0}.day{min-height:78px;background:#f5f7fc;color:#172a5a;padding:5px;border:1px solid #dbe2ef;border-radius:7px;text-align:left;font-weight:400;overflow:hidden}.day.selected{border:2px solid #172a5a;background:#e9effb}.day.blank{background:transparent;border:0}.day.today{box-shadow:inset 0 0 0 2px #c9a84e}.daynum{display:block;font-weight:700}.event{display:block;font-size:10px;background:#dce7ff;border-radius:4px;padding:2px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.datebox{background:#f5f7fc;border-radius:9px;padding:12px;margin-top:12px}@media(max-width:520px){.day{min-height:58px;padding:3px}.event{font-size:9px}.monthgrid{gap:2px}}</style></head><body><header><strong>MathLab 2</strong> — Δοκιμαστική έκδοση</header><main><p class="notice">Πιλοτική ασφαλής έκδοση. Οι εγγραφές αποθηκεύονται στη βάση MathLab σε ξεχωριστούς πίνακες. Χρησιμοποίησε φανταστικούς μαθητές μέχρι να ολοκληρωθεί ο έλεγχος.</p><div class="card" id="authPanel"><h2>Σύνδεση διαχειριστή</h2><form id="loginForm"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Κωδικός<input name="password" type="password" autocomplete="current-password" required></label><button>Σύνδεση</button></form></div><div id="userPanel" class="hidden"><button id="logout" class="alt">Αποσύνδεση</button></div><div id="workspace" class="hidden"><nav><button id="showStudents">Μαθητές</button><button id="showCalendar" class="alt">Ημερολόγιο</button></nav><p id="status" role="status"></p><div id="students"><div class="card"><h2>Εγγραφή μαθητή</h2><form id="studentForm"><label>Μαθητής<input name="name" required maxlength="100"></label><label>Κινητό<input name="phone" required type="tel" maxlength="30"></label><label>Τάξη<input name="grade" required maxlength="50"></label><label>Μηνιαία δίδακτρα (€) — προαιρετικό<input name="tuition" type="number" min="0" step="0.01" inputmode="decimal" placeholder="π.χ. 80"></label><button>Αποθήκευση μαθητή</button></form></div><div class="card"><h2>Μαθητές</h2><ul id="studentList"></ul></div></div><div id="calendar" class="hidden"><div class="card"><div class="monthbar"><button type="button" id="prevMonth" class="alt">‹</button><h2 id="monthTitle">Ημερολόγιο</h2><button type="button" id="nextMonth" class="alt">›</button></div><div class="monthgrid" id="monthGrid"></div><div id="dayEditor" class="datebox hidden"><h3 id="editDateTitle">Νέο μάθημα</h3><form id="lessonForm"><input type="hidden" name="date"><label>Ώρα<input type="time" name="time" required></label><label>Μαθητής<select name="student" id="studentSelect" required></select></label><label>Μάθημα<input name="subject" required maxlength="100"></label><button type="submit">Αποθήκευση μαθήματος</button><button type="button" id="cancelLesson" class="alt">Ακύρωση</button></form></div><div class="datebox"><strong id="selectedTitle"></strong><ul id="lessonList"></ul></div></div></div></div></main><script type="module">import{createClient}from"https://esm.sh/@supabase/supabase-js@2.76.1";
const supabase=createClient("https://terlbwqcmrfsjhagtxch.supabase.co","sb_publishable_-v9E4RXTp2VBKsCiGjcQ3A_d3kJmdJ0");
const $=x=>document.getElementById(x),state={students:[],lessons:[]};let user=null,viewed=new Date(),selected="";const iso=(y,m,d)=>[y,String(m+1).padStart(2,"0"),String(d).padStart(2,"0")].join("-");selected=iso(viewed.getFullYear(),viewed.getMonth(),viewed.getDate());
function message(x){$("status").textContent=x}
function item(list,x){let li=document.createElement("li");li.textContent=x;list.append(li)}
async function refresh(){const [a,b]=await Promise.all([supabase.from("mathlab2_students").select("id,full_name,phone,grade,monthly_tuition").order("full_name"),supabase.from("mathlab2_lessons").select("id,student_id,lesson_date,lesson_time,subject").order("lesson_date")]);if(a.error)throw a.error;if(b.error)throw b.error;state.students=a.data||[];state.lessons=b.data||[];render()}
function render(){const list=$("studentList"),sel=$("studentSelect");list.replaceChildren();sel.replaceChildren(new Option("Επιλογή μαθητή",""));for(const s of state.students){item(list,s.full_name+" — "+s.phone+" — "+s.grade+" — Δίδακτρα: "+(s.monthly_tuition===null?"Δεν ορίστηκαν":Number(s.monthly_tuition).toLocaleString("el-GR",{style:"currency",currency:"EUR"})));sel.append(new Option(s.full_name,s.id))}calendarRender()}
function calendarRender(){const y=viewed.getFullYear(),m=viewed.getMonth();$("monthTitle").textContent=new Intl.DateTimeFormat("el-GR",{month:"long",year:"numeric"}).format(viewed);const grid=$("monthGrid");grid.replaceChildren();for(const w of ["Δε","Τρ","Τε","Πε","Πα","Σα","Κυ"]){const d=document.createElement("span");d.className="weekday";d.textContent=w;grid.append(d)}const offset=(new Date(y,m,1).getDay()+6)%7;for(let i=0;i<offset;i++){let d=document.createElement("div");d.className="day blank";grid.append(d)}for(let i=1;i<=new Date(y,m+1,0).getDate();i++){const date=iso(y,m,i),btn=document.createElement("button");btn.type="button";btn.className="day"+(selected===date?" selected":"");let sp=document.createElement("span");sp.className="daynum";sp.textContent=i;btn.append(sp);for(const l of state.lessons.filter(v=>v.lesson_date===date).slice(0,3)){const ev=document.createElement("span");ev.className="event";ev.textContent=l.lesson_time.slice(0,5)+" "+(state.students.find(s=>s.id===l.student_id)?.full_name||"")+" · "+l.subject;btn.append(ev)}btn.onclick=()=>{selected=date;$("lessonForm").elements.date.value=date;$("editDateTitle").textContent="Μάθημα για "+date;$("dayEditor").classList.remove("hidden");calendarRender();$("dayEditor").scrollIntoView({block:"nearest"})};grid.append(btn)}$("selectedTitle").textContent="Μαθήματα: "+selected;const list=$("lessonList");list.replaceChildren();const lessons=state.lessons.filter(l=>l.lesson_date===selected).sort((a,b)=>a.lesson_time.localeCompare(b.lesson_time));if(!lessons.length)item(list,"Δεν υπάρχουν μαθήματα αυτή την ημέρα.");for(const l of lessons)item(list,l.lesson_time.slice(0,5)+" — "+(state.students.find(s=>s.id===l.student_id)?.full_name||"") +" — "+l.subject)}
function show(name){$("students").classList.toggle("hidden",name!=="students");$("calendar").classList.toggle("hidden",name!=="calendar")}
$("showStudents").onclick=()=>show("students");$("showCalendar").onclick=()=>show("calendar");$("prevMonth").onclick=()=>{viewed=new Date(viewed.getFullYear(),viewed.getMonth()-1,1);calendarRender()};$("nextMonth").onclick=()=>{viewed=new Date(viewed.getFullYear(),viewed.getMonth()+1,1);calendarRender()};$("cancelLesson").onclick=()=>$("dayEditor").classList.add("hidden");
$("studentForm").onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector("button");b.disabled=true;try{const d=new FormData(f);const{error}=await supabase.from("mathlab2_students").insert({full_name:String(d.get("name")).trim(),phone:String(d.get("phone")).trim(),grade:String(d.get("grade")).trim(),monthly_tuition:String(d.get("tuition")).trim()===""?null:Number(d.get("tuition"))});if(error)throw error;await refresh();f.reset();message("Ο μαθητής αποθηκεύτηκε μόνιμα.")}catch(e){message("Σφάλμα αποθήκευσης: "+e.message)}finally{b.disabled=false}};
$("lessonForm").onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector('button[type="submit"]');b.disabled=true;try{const d=new FormData(f);const{error}=await supabase.from("mathlab2_lessons").insert({lesson_date:String(d.get("date")),student_id:String(d.get("student")),lesson_time:String(d.get("time")),subject:String(d.get("subject")).trim()});if(error)throw error;await refresh();f.reset();$("dayEditor").classList.add("hidden");message("Το μάθημα αποθηκεύτηκε μόνιμα.")}catch(e){message("Σφάλμα αποθήκευσης μαθήματος: "+e.message)}finally{b.disabled=false}};
async function enter(){const{data:{user:u},error}=await supabase.auth.getUser();if(error||!u){$("authPanel").classList.remove("hidden");$("userPanel").classList.add("hidden");$("workspace").classList.add("hidden");return}const{data:p,error:pe}=await supabase.from("profiles").select("role,active").eq("id",u.id).maybeSingle();if(pe||!p?.active||p.role!=="admin"){message("Απαιτείται ενεργός λογαριασμός διαχειριστή.");return}user=u;$("authPanel").classList.add("hidden");$("userPanel").classList.remove("hidden");$("workspace").classList.remove("hidden");try{await refresh();message("Συνδέθηκες. Οι εγγραφές συγχρονίζονται με τη βάση.")}catch(e){message("Δεν φορτώθηκαν δεδομένα: "+e.message)}}
$("loginForm").onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector("button");b.disabled=true;message("Σύνδεση...");try{const d=new FormData(f);const{error}=await supabase.auth.signInWithPassword({email:String(d.get("email")),password:String(d.get("password"))});if(error)throw error;await enter()}catch(e){message("Σφάλμα σύνδεσης: "+e.message)}finally{b.disabled=false}};
$("logout").onclick=async()=>{await supabase.auth.signOut();user=null;location.reload()};enter();</script></body></html>
