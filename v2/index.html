<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MathLab 2 — Δοκιμή</title><style>:root{font-family:system-ui,sans-serif;background:#f2f5fa;color:#172a5a}body{margin:0}header{background:#172a5a;color:#fff;padding:18px}main{max-width:720px;margin:auto;padding:16px}.card{background:white;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0001}button{border:0;border-radius:8px;background:#172a5a;color:white;padding:12px 15px;margin:3px;font-weight:650}button.alt{background:#dfe6f2;color:#172a5a}label{display:block;margin-top:10px}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #b5c0d3;border-radius:7px;margin-top:4px;font:inherit}li{padding:9px 0;border-bottom:1px solid #eee}.hidden{display:none}.notice{background:#fff3d3;color:#653d00;padding:13px;border-radius:10px}small{color:#52637d}</style></head><body><header><strong>MathLab 2</strong> — Δοκιμαστική έκδοση</header><main><p class="notice">Μόνο για δοκιμές με φανταστικούς μαθητές. Τα στοιχεία διατηρούνται αποκλειστικά στον συγκεκριμένο browser. Δεν συνδέεται με την υπάρχουσα βάση MathLab.</p><nav><button id="showStudents">Μαθητές</button><button id="showCalendar" class="alt">Ημερολόγιο</button></nav><p id="status" role="status"></p><div id="students"><div class="card"><h2>Εγγραφή μαθητή</h2><form id="studentForm"><label>Μαθητής<input name="name" required maxlength="100"></label><label>Κινητό<input name="phone" required type="tel" maxlength="30"></label><label>Τάξη<input name="grade" required maxlength="50"></label><button>Αποθήκευση μαθητή</button></form></div><div class="card"><h2>Μαθητές</h2><ul id="studentList"></ul></div></div><div id="calendar" class="hidden"><div class="card"><h2>Προσθήκη μαθήματος</h2><form id="lessonForm"><label>Ημερομηνία<input type="date" name="date" required></label><label>Μαθητής<select name="student" id="studentSelect" required></select></label><label>Ώρα<input type="time" name="time" required></label><label>Μάθημα<input name="subject" required maxlength="100"></label><button>Αποθήκευση μαθήματος</button></form></div><div class="card"><h2>Ημερολόγιο μαθημάτων</h2><ul id="lessonList"></ul></div></div></main><script>
const key="mathlab2-demo-v1",$=id=>document.getElementById(id);let state;try{state=JSON.parse(localStorage.getItem(key));if(!Array.isArray(state.students)||!Array.isArray(state.lessons))throw Error()}catch{state={students:[],lessons:[]}}
function save(){localStorage.setItem(key,JSON.stringify(state))}
function item(list,text){const li=document.createElement("li");li.textContent=text;list.append(li)}
function render(){$("studentList").replaceChildren();$("lessonList").replaceChildren();$("studentSelect").replaceChildren(new Option("Επιλογή μαθητή",""));for(const s of state.students){item($("studentList"),s.name+" — "+s.phone+" — "+s.grade);$("studentSelect").append(new Option(s.name,s.id))}for(const l of [...state.lessons].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))){const s=state.students.find(x=>x.id===l.student);item($("lessonList"),l.date+" "+l.time+" — "+(s?.name||"Μαθητής")+" — "+l.subject)}}
function show(which){$("students").classList.toggle("hidden",which!=="students");$("calendar").classList.toggle("hidden",which!=="calendar");$("showStudents").className=which==="students"?"":"alt";$("showCalendar").className=which==="calendar"?"":"alt"}
$("showStudents").onclick=()=>show("students");$("showCalendar").onclick=()=>show("calendar");
$("studentForm").onsubmit=e=>{e.preventDefault();const f=e.currentTarget,fd=new FormData(f),name=String(fd.get("name")).trim(),phone=String(fd.get("phone")).trim(),grade=String(fd.get("grade")).trim();if(!name||!phone||!grade)return;if(state.students.some(s=>s.name===name&&s.phone===phone)){$("status").textContent="Ο μαθητής υπάρχει ήδη.";return}state.students.push({id:crypto.randomUUID(),name,phone,grade});try{save();f.reset();render();$("status").textContent="Ο μαθητής αποθηκεύτηκε στη δοκιμαστική συσκευή."}catch{$("status").textContent="Η αποθήκευση απέτυχε."}};
$("lessonForm").onsubmit=e=>{e.preventDefault();const f=e.currentTarget,fd=new FormData(f),date=String(fd.get("date")),time=String(fd.get("time")),student=String(fd.get("student")),subject=String(fd.get("subject")).trim();if(!date||!time||!student||!subject||!state.students.some(s=>s.id===student))return;state.lessons.push({date,time,student,subject});try{save();f.reset();render();$("status").textContent="Το μάθημα αποθηκεύτηκε στο δοκιμαστικό ημερολόγιο."}catch{$("status").textContent="Η αποθήκευση απέτυχε."}};render();</script></body></html>
